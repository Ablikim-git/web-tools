<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片压缩工具</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  background:#f8f7f2; color:#333; min-height:100vh;
}
.container { max-width: 1000px; margin:0 auto; padding:28px 16px 60px; }
h1 { font-size:22px; font-weight:600; letter-spacing:.5px; }
.sub { color:#8a8f98; font-size:13px; margin:6px 0 22px; }

.card {
  background:#fff; border:1px solid #e5e7eb; border-radius:10px;
  padding:18px 20px; margin-bottom:16px;
}
.card h2 { font-size:14px; font-weight:600; margin-bottom:12px; color:#111; }

.drop {
  border:2px dashed #d1d5db; border-radius:10px; padding:38px 16px;
  text-align:center; color:#9ca3af; font-size:14px; cursor:pointer; transition:all .15s;
}
.drop:hover, .drop.dragover { border-color:#3b82f6; background:#eff6ff; color:#3b82f6; }

.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.btn {
  border:1px solid #d1d5db; background:#fff; color:#333;
  padding:7px 14px; border-radius:8px; cursor:pointer; font-size:13px; transition:all .15s;
}
.btn:hover { border-color:#3b82f6; color:#3b82f6; }
.btn.active { background:#3b82f6; border-color:#3b82f6; color:#fff; }
.btn.primary { background:#3b82f6; border-color:#3b82f6; color:#fff; font-weight:500; padding:10px 22px; font-size:14px; }
.btn.primary:hover { background:#2563eb; }
.btn.danger:hover { border-color:#ef4444; color:#ef4444; }

.color-btn { width:34px; height:34px; border-radius:50%; border:2px solid #e5e7eb; cursor:pointer; transition:transform .12s; }
.color-btn:hover { transform:scale(1.12); }
.color-btn.active { border-color:#111; box-shadow:0 0 0 3px #fff inset; }

.slider-row { display:flex; align-items:center; gap:12px; }
input[type=range] { flex:1; accent-color:#3b82f6; }
input[type=number] { width:88px; padding:6px 8px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; outline:none; }
input[type=number]:focus { border-color:#3b82f6; }

.grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.preview-box { text-align:center; }
.preview-box img {
  max-width:100%; max-height:320px; border-radius:8px; border:1px solid #eee;
  background:repeating-conic-gradient(#f2f2f2 0 25%, #fff 0 50%) 0 0 / 16px 16px;
}
.preview-box .cap { font-size:12px; color:#888; margin-top:8px; }

.meta { font-size:12px; color:#666; line-height:2; }
.meta b { color:#111; }
.est { font-size:13px; color:#3b82f6; font-weight:500; }
.hint { font-size:12px; color:#9ca3af; }

.hidden { display:none; }
.result-line { display:flex; justify-content:space-between; font-size:13px; padding:5px 0; border-bottom:1px dashed #f0f0f0; }
.result-line:last-child { border-bottom:none; }
.result-line b { color:#111; }
#faceStatus { font-size:13px; font-weight:500; }

/* ========== 📱 手机端适配（以下代码只在手机/小屏幕时生效，电脑端不受影响） ========== */
@media (max-width: 768px) {
  .container { padding: 16px 10px 40px; }   /* 页面两侧留白缩小 */
  h1 { font-size: 18px; }
  .grid { grid-template-columns: 1fr; }      /* 原图/效果图：左右并排改成上下排列 */
  .drop { padding: 24px 10px; }
  .preview-box img { max-height: 240px; }
  .slider-row { gap: 8px; }
  input[type=number] { width: 70px; }        /* 宽高输入框缩小 */
  .card { padding: 14px; }
}
/* ========== 📱 手机端适配结束 ========== */
</style>
</head>
<body>
<div class="container">
  <h1>🖼 图片压缩工具</h1>
  <div class="sub">压缩 / 调大小 · 本地处理，图片不会上传</div>

  <div class="card">
    <div class="drop" id="dropZone">
      <div id="emptyHint">点击选择图片，或将图片拖到此处<br><span class="hint" style="font-size:12px">支持 JPG / PNG / WebP</span></div>
      <div id="fileInfo" class="hidden" style="font-size:13px;color:#333"></div>
    </div>
    <input type="file" id="fileInput" accept="image/*" class="hidden">
  </div>

  <div id="toolArea" class="hidden">
    <!-- 预览 -->
    <div class="card">
      <div class="grid">
        <div class="preview-box">
          <img id="origPreview" alt="原图">
          <div class="cap">原图</div>
        </div>
        <div class="preview-box">
          <img id="preview" alt="效果图">
          <div class="cap">效果图 <span id="curDim" style="color:#3b82f6"></span></div>
        </div>
      </div>
      <div class="meta" style="margin-top:12px">
        文件：<b id="fileInfo2"></b> · 尺寸：<b id="origDim"></b>
        <br>预计输出：<span class="est" id="estSize"></span>
      </div>
    </div>

    <!-- 压缩 -->
    <div class="card">
      <h2>压缩质量</h2>
      <div class="slider-row" style="margin-bottom:12px">
        <span style="font-size:13px">质量</span>
        <input type="range" id="quality" min="1" max="100" value="70">
        <b id="qualityVal" style="font-size:13px;min-width:34px">70%</b>
      </div>
      <div class="row">
        <button class="btn" data-q="85">高质量 (85%)</button>
        <button class="btn active" data-q="70">标准 (70%)</button>
        <button class="btn" data-q="50">低质量 (50%)</button>
        <span style="width:12px"></span>
        <span style="font-size:13px;color:#666">输出格式</span>
        <button class="btn active" data-fmt="image/jpeg">JPG</button>
        <button class="btn" data-fmt="image/webp">WebP</button>
        <button class="btn" data-fmt="image/png">PNG</button>
      </div>
    </div>

    <!-- 调整大小 -->
    <div class="card">
      <h2>调整大小</h2>
      <div class="row" style="margin-bottom:12px">
        <button class="btn" data-pct="100">原尺寸 100%</button>
        <button class="btn" data-pct="75">75%</button>
        <button class="btn" data-pct="50">50%</button>
        <button class="btn" data-pct="25">25%</button>
      </div>
      <div class="row">
        <span style="font-size:13px;color:#666">自定义宽高</span>
        <input type="number" id="wInput" min="1" placeholder="宽">
        <span style="color:#999">×</span>
        <input type="number" id="hInput" min="1" placeholder="高">
        <label style="font-size:12px;color:#666;display:flex;align-items:center;gap:4px">
          <input type="checkbox" id="lockRatio" checked> 锁定比例
        </label>
        <button class="btn" id="applyResize">应用</button>
      </div>
    </div>

    <!-- 结果与下载 -->
    <div class="card">
      <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:12px">
        <div style="flex:1;min-width:220px">
          <div class="result-line"><span>预计大小（估算）</span><b id="est2">-</b></div>
          <div class="result-line"><span>实际输出大小</span><b id="actualSize">-</b></div>
          <div class="result-line"><span>当前尺寸</span><b id="dim2">-</b></div>
        </div>
        <div class="row">
          <button class="btn danger" id="resetBtn">重置为原图</button>
          <button class="btn primary" id="downloadBtn">⬇ 压缩并下载</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);

let origCanvas=null, workCanvas=null, workCtx=null;
let origSize=0, origName='image', origType='';
let quality=70, format='image/jpeg';

function fmtSize(b){
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(2)+' MB';
}

/* ================= 加载 ================= */
let origCtx = null;
function loadFile(file){
  if(!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      origCanvas = document.createElement('canvas');
      origCanvas.width = img.naturalWidth;
      origCanvas.height = img.naturalHeight;
      origCtx = origCanvas.getContext('2d');
      origCtx.drawImage(img,0,0);

      workCanvas = document.createElement('canvas');
      workCanvas.width = origCanvas.width;
      workCanvas.height = origCanvas.height;
      workCtx = workCanvas.getContext('2d');
      workCtx.drawImage(origCanvas,0,0);

      origSize = file.size;
      origName = file.name.replace(/\.[^.]+$/,'') || 'image';
      origType = file.type;

      $('fileInfo').textContent = file.name + ' · ' + fmtSize(file.size) + ' · ' + origCanvas.width + '×' + origCanvas.height;
      $('fileInfo').classList.remove('hidden');
      $('emptyHint').classList.add('hidden');
      $('toolArea').classList.remove('hidden');

      $('origPreview').src = origCanvas.toDataURL('image/jpeg',0.9);
      $('fileInfo2').textContent = file.name;
      $('origDim').textContent = origCanvas.width + '×' + origCanvas.height;
      $('wInput').value = origCanvas.width;
      $('hInput').value = origCanvas.height;
      $('actualSize').textContent = '-';
      updateAll();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ================= 预览 & 估算 ================= */
function updateAll(){ updatePreview(); updateEstimate(); }

function updatePreview(){
  if(!workCanvas) return;
  $('preview').src = workCanvas.toDataURL('image/jpeg',0.9);
  const d = workCanvas.width + '×' + workCanvas.height;
  $('curDim').textContent = d;
  $('dim2').textContent = d;
}

function updateEstimate(){
  if(!workCanvas) return;
  const targetPixels = workCanvas.width * workCanvas.height;
  const origPixels = origCanvas.width * origCanvas.height;
  const ratio = targetPixels / origPixels;
  const q = quality / 100;
  let base = origSize;
  if(origType === 'image/png') base = origSize * 0.35;
  let est = base * ratio * Math.pow(q, 1.3);
  if(format === 'image/webp') est *= 0.75;
  if(format === 'image/png') est = origSize * ratio * 1.1;
  est = Math.max(est, 2000);
  const s = fmtSize(est);
  $('estSize').textContent = '约 ' + s + '（估算值，仅供参考）';
  $('est2').textContent = s;
}

/* ================= 压缩下载 ================= */
function compressAndDownload(){
  if(!workCanvas) return;
  const q = format === 'image/png' ? undefined : quality/100;
  workCanvas.toBlob(blob => {
    if(!blob){ alert('压缩失败，请重试'); return; }
    $('actualSize').textContent = fmtSize(blob.size);
    const ext = {'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[format];
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = origName + '_压缩_' + workCanvas.width + 'x' + workCanvas.height + '.' + ext;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  }, format, q);
}

/* ================= 调整大小 ================= */
function doResize(w,h){
  const tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  const tc = tmp.getContext('2d');
  tc.imageSmoothingEnabled = true;
  tc.imageSmoothingQuality = 'high';
  tc.drawImage(workCanvas, 0, 0, w, h);
  workCanvas.width = w; workCanvas.height = h;
  workCtx.drawImage(tmp, 0, 0);
  $('wInput').value = w;
  $('hInput').value = h;
  updateAll();
}

function presetResize(pct){
  const w = Math.max(1, Math.round(origCanvas.width * pct / 100));
  const h = Math.max(1, Math.round(origCanvas.height * pct / 100));
  doResize(w,h);
}

function applyCustomResize(){
  let w = parseInt($('wInput').value,10);
  let h = parseInt($('hInput').value,10);
  if(!w || !h || w<1 || h<1){ alert('请输入有效的宽高'); return; }
  w = Math.min(w, 8000); h = Math.min(h, 8000);
  doResize(w,h);
}

/* ================= 事件绑定 ================= */
const drop = $('dropZone');
drop.addEventListener('click', ()=>$('fileInput').click());
drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('dragover'); });
drop.addEventListener('dragleave', ()=>drop.classList.remove('dragover'));
drop.addEventListener('drop', e=>{
  e.preventDefault();
  drop.classList.remove('dragover');
  loadFile(e.dataTransfer.files[0]);
});
$('fileInput').addEventListener('change', e=>loadFile(e.target.files[0]));

$('quality').addEventListener('input', e=>{
  quality = +e.target.value;
  $('qualityVal').textContent = quality + '%';
  updateEstimate();
});
document.querySelectorAll('[data-q]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    quality = +btn.dataset.q;
    $('quality').value = quality;
    $('qualityVal').textContent = quality + '%';
    document.querySelectorAll('[data-q]').forEach(b=>b.classList.toggle('active', b===btn));
    updateEstimate();
  });
});
document.querySelectorAll('[data-fmt]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    format = btn.dataset.fmt;
    document.querySelectorAll('[data-fmt]').forEach(b=>b.classList.toggle('active', b===btn));
    updateEstimate();
  });
});
document.querySelectorAll('[data-pct]').forEach(btn=>{
  btn.addEventListener('click', ()=>presetResize(+btn.dataset.pct));
});
$('applyResize').addEventListener('click', applyCustomResize);

$('wInput').addEventListener('change', ()=>{
  if(!workCanvas || !$('lockRatio').checked) return;
  const h = Math.max(1, Math.round(+$('wInput').value * workCanvas.height / workCanvas.width));
  $('hInput').value = h;
});
$('hInput').addEventListener('change', ()=>{
  if(!workCanvas || !$('lockRatio').checked) return;
  const w = Math.max(1, Math.round(+$('hInput').value * workCanvas.width / workCanvas.height));
  $('wInput').value = w;
});

$('resetBtn').addEventListener('click', ()=>{
  if(!origCanvas) return;
  workCanvas.width = origCanvas.width;
  workCanvas.height = origCanvas.height;
  workCtx.drawImage(origCanvas,0,0);
  $('wInput').value = origCanvas.width;
  $('hInput').value = origCanvas.height;
  $('actualSize').textContent = '-';
  updateAll();
});
$('downloadBtn').addEventListener('click', compressAndDownload);
</script>
</body>
</html>
