<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片格式转换</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f8f7f2;
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 30px; }
  .container {
    width: 100%;
    max-width: 720px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 1px 6px rgba(0,0,0,.08);
    padding: 24px;
  }
  .drop-zone {
    border: 2px dashed #ccc;
    border-radius: 8px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    font-size: 14px;
    color: #888;
  }
  .drop-zone:hover, .drop-zone.over { border-color: #4a90d9; background: #f0f6ff; }
  .drop-zone b { color: #4a90d9; }
  input[type="file"] { display: none; }
  .preview {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 20px;
    padding: 16px;
    background: #fafafa;
    border-radius: 8px;
  }
  .preview img { max-width: 120px; max-height: 120px; border-radius: 4px; background: #fff; border: 1px solid #eee; }
  .info { flex: 1; font-size: 13px; color: #666; }
  .info .name { font-size: 14px; color: #333; word-break: break-all; }
  .controls { display: flex; align-items: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .controls label { font-size: 14px; color: #666; }
  select {
    padding: 8px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    background: #fff;
    cursor: pointer;
  }
  button {
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    background: #4a90d9;
    color: #fff;
  }
  button:hover { background: #3a7fc9; }
  button:disabled { background: #bbb; cursor: not-allowed; }
  .download-link {
    display: none;
    margin-top: 16px;
    padding: 10px 20px;
    background: #eaf3ff;
    border: 1px solid #4a90d9;
    border-radius: 6px;
    color: #4a90d9;
    text-decoration: none;
    font-size: 14px;
    text-align: center;
  }
  .download-link:hover { background: #dcebff; }
  .msg { margin-top: 12px; font-size: 13px; color: #e74c3c; min-height: 18px; }
  .note { margin-top: 16px; font-size: 12px; color: #999; line-height: 1.7; }
</style>
</head>
<body>
  <h1>图片格式转换</h1>
  <div class="sub">PNG ↔ JPG ↔ WebP ↔ GIF 互转 · 本地处理，不上传</div>

  <div class="container">
    <div class="drop-zone" id="dropZone">
      拖拽图片到这里，或 <b>点击选择图片</b><br>
      <small>支持 PNG / JPG / WebP / GIF</small>
    </div>
    <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif">

    <div class="preview" id="preview" style="display:none;">
      <img id="previewImg" alt="预览">
      <div class="info">
        <div class="name" id="fileName"></div>
        <div id="fileSize" style="margin-top:4px;"></div>
      </div>
    </div>

    <div class="controls">
      <label for="format">转换为：</label>
      <select id="format">
        <option value="png">PNG</option>
        <option value="jpeg">JPG</option>
        <option value="webp">WebP</option>
        <option value="gif">GIF</option>
      </select>
      <button id="convertBtn" disabled>转换并下载</button>
    </div>
    <div class="msg" id="msg"></div>
    <a class="download-link" id="downloadLink" download>点击下载转换后的图片</a>

    <div class="note">
      说明：<br>
      · JPG 不支持透明背景，透明区域会填充为白色。<br>
      · 动图 GIF 仅转换静态首帧（本页面使用浏览器原生能力，不处理动画）。<br>
      · 所有转换均在本地浏览器完成，图片不会上传到任何服务器。
    </div>
  </div>

<script>
(function () {
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const previewImg = document.getElementById('previewImg');
  const fileName = document.getElementById('fileName');
  const fileSize = document.getElementById('fileSize');
  const formatSel = document.getElementById('format');
  const convertBtn = document.getElementById('convertBtn');
  const msg = document.getElementById('msg');
  const downloadLink = document.getElementById('downloadLink');

  let currentFile = null;
  let currentDataUrl = null;

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('over');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) handleFile(fileInput.files[0]);
    fileInput.value = '';
  });

  function handleFile(file) {
    if (!/^image\/(png|jpe?g|webp|gif)$/.test(file.type)) {
      msg.textContent = '不支持的文件格式，请选择 PNG / JPG / WebP / GIF';
      return;
    }
    currentFile = file;
    const reader = new FileReader();
    reader.onload = function (e) {
      currentDataUrl = e.target.result;
      const img = new Image();
      img.onload = function () {
        previewImg.src = currentDataUrl;
        fileName.textContent = file.name;
        fileSize.textContent = formatSize(file.size) + ' · ' + img.width + ' × ' + img.height + ' px';
        preview.style.display = 'flex';
        msg.textContent = '';
        downloadLink.style.display = 'none';
        convertBtn.disabled = false;
        // 默认选择的目标格式建议为与原图不同的
        suggestFormat(file.type);
      };
      img.onerror = function () { msg.textContent = '图片加载失败'; };
      img.src = currentDataUrl;
    };
    reader.readAsDataURL(file);
  }

  function suggestFormat(type) {
    const map = { 'image/png': 'jpeg', 'image/jpeg': 'png', 'image/webp': 'png', 'image/gif': 'png' };
    formatSel.value = map[type] || 'png';
  }

  convertBtn.addEventListener('click', convert);

  function convert() {
    if (!currentDataUrl) return;
    const target = formatSel.value;
    convertBtn.disabled = true;
    const img = new Image();
    img.onload = function () {
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      if (target === 'jpeg') {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      ctx.drawImage(img, 0, 0);
      let mime = 'image/png';
      if (target === 'jpeg') mime = 'image/jpeg';
      else if (target === 'webp') mime = 'image/webp';
      else if (target === 'gif') mime = 'image/gif';
      try {
        const quality = (target === 'jpeg' || target === 'webp') ? 0.92 : undefined;
        const dataUrl = canvas.toDataURL(mime, quality);
        const baseName = (currentFile.name.replace(/\.[^.]+$/, '') || 'image');
        downloadLink.href = dataUrl;
        downloadLink.download = baseName + '.' + target;
        downloadLink.textContent = '下载 ' + baseName + '.' + target + ' (' + formatSize(dataUrl.length * 0.75) + ')';
        downloadLink.style.display = 'block';
        msg.textContent = '';
      } catch (err) {
        msg.textContent = '转换失败：' + err.message;
      }
      convertBtn.disabled = false;
    };
    img.onerror = function () { msg.textContent = '图片加载失败'; convertBtn.disabled = false; };
    img.src = currentDataUrl;
  }

  function formatSize(bytes) {
    if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(2) + ' MB';
    if (bytes >= 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return bytes + ' B';
  }
})();
</script>
</body>
</html>
